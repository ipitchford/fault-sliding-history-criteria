# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Run every check (-I -O -B) in a copy and compare regenerated JSON with the retained outputs
        run: python -I -B tools/replay_compare.py .
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
