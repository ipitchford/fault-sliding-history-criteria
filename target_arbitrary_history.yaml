target_id: arbitrary-history-point-source-historical-centre
search_date: 2026-10-28
intended_contribution_unit: theorem
claim:
  exact_statement: |
    Let alpha, Delta, f, c_p, mu be positive. Let q belong to C^1([0,T]),
    q>=0, with q extended by zero before time zero. Assume either q(0)=q0>0,
    or q(0)=0 with q nondecreasing on some initial [0,t_start] and
    q(t)>0 for every t in (0,t_start].
    Use the point-source pressure and zero-SIF circular trial branch of the
    manuscript. Assume its unique positive radius R(t) exists on (0,T].
    Then all trial slip velocities are nonnegative for every r<R(t) and
    every t in (0,T] if and only if the centre criterion C(t)>=0 for all
    t in (0,T]. Whenever these equivalent conditions hold, every noncentral
    interior velocity and the edge-normalised velocity is strictly positive,
    and R'(t)>0 throughout (0,T]. Earlier tangential centre zeros are allowed.
    Consequently the first threshold contact occurs only at the centre,
    and any first loss of forward-slip admissibility is detected by the
    first negative centre value, even after earlier tangential contacts.
  exclusions:
    - Does not replace the whole-history condition by an instantaneous centre test after earlier negative centre velocities.
    - This target is for the point source; target_gaussian_startup.yaml separately treats Gaussian sources under monotone prebirth central pressure and transverse nucleation.
    - Does not cover zero-initial-rate histories with arbitrarily early reversals of q'.
    - Does not determine post-locking pulse propagation or seismic hazard.
    - Does not claim novelty of Kaluza/Jurkat-style inverse-positivity principles or standard Volterra resolvent theory.
