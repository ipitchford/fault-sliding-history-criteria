  indices: r in [0,R), source age u=t-s>0
  scaling: pressure p=(4*pi*alpha*S*w)^(-1) integral_0^t q(s)*exp(-r^2/[4*alpha*(t-s)])/(t-s) ds
  basis_order: continuous radial coordinate
  symmetries: [axisymmetry, radial dilation]
